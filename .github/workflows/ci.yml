name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs parent commits reachable in the working tree.
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Lint (format check + ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Type check (mypy strict)
        run: mypy src tests

      - name: Fast tests
        run: pytest

      - name: Coverage gate (85 pct)
        run: pytest --cov=src/gatehouse --cov-report=term --cov-fail-under=85

      - name: Validate country packs
        run: python scripts/validate_packs.py

      - name: Offline mini evaluation
        run: python -m gatehouse.evaluation.run_mini --pack packs/in/pack.yaml

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The console carried typecheck, lint, and parity scripts that nothing ran.
  # A dead feature shipped behind an eslint warning because of it.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install locked deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (warnings are failures)
        run: npm run lint -- --max-warnings=0

      - name: Locale parity
        run: npm run check:i18n

      - name: Override reduction
        run: npm run check:overrides

      - name: Build
        run: npm run build
