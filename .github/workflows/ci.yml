name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Lint (format check + ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Type check (mypy strict)
        run: mypy src tests

      - name: Fast tests
        run: pytest

      - name: Coverage gate (85 pct)
        run: pytest --cov=src/gatehouse --cov-report=term --cov-fail-under=85

      - name: Validate country packs
        run: python scripts/validate_packs.py

      - name: Offline mini evaluation
        run: python -m gatehouse.evaluation.run_mini --pack packs/in/pack.yaml

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
