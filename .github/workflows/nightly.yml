name: nightly

on:
  schedule:
    # 19:30 UTC is 01:00 IST: off-peak for the builder, results ready by morning.
    - cron: "30 19 * * *"
  workflow_dispatch:

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Static gates (format, lint, types)
        run: |
          ruff format --check .
          ruff check .
          mypy src tests

      - name: Full fast suite
        run: pytest

      - name: Chaos suite (failure matrix rows 1-7)
        run: pytest tests/test_chaos.py -v

      - name: Validate country packs
        run: python scripts/validate_packs.py

      - name: Offline mini evaluation
        run: |
          mkdir -p docs/eval-results
          python -m gatehouse.evaluation.run_mini --pack packs/in/pack.yaml --json docs/eval-results/mini-metrics.json
          cat docs/eval-results/mini-metrics.json

      - name: Offline full dev-split evaluation
        run: |
          python -m gatehouse.evaluation.run_full --pack packs/in/pack.yaml --split dev --json docs/eval-results/full-dev-metrics.json
          cat docs/eval-results/full-dev-metrics.json

      - name: Offline threshold calibration sweep
        run: |
          python -m gatehouse.evaluation.calibrate --pack packs/in/pack.yaml --json docs/eval-results/calibration-dev.json

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics-${{ github.run_id }}
          path: |
            docs/eval-results/mini-metrics.json
            docs/eval-results/full-dev-metrics.json
            docs/eval-results/calibration-dev.json
          retention-days: 90
