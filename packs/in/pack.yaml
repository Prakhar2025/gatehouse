    strong:
      - "kyc expired"
      - "kyc has expired"
      - "kyc expires"
      - "kyc will expire"
      - "account will be blocked"
      - "account has been blocked"
      - "digital arrest"
      - "verify your account immediately"
      - "re-kyc required today"
      - "click to avoid suspension"
      - "your sim will be deactivated"
      - "parcel held at customs"
      - "lottery winner"
      - "you have won"
      - "claim your prize"
