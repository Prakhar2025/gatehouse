    aliases: [Zomato]
    official_domains: [zomato.com]
  - id: irctc
    name: IRCTC
    aliases: [IRCTC]
    official_domains: [irctc.co.in]
  - id: bluedart
    name: BlueDart
    aliases: [BlueDart]
    official_domains: [bluedart.com]
  - id: delhivery
    name: Delhivery
    aliases: [Delhivery]
    official_domains: [delhivery.com]
  - id: dhl
    name: DHL
    aliases: [DHL]
    official_domains: [dhl.com, dhl.co.in]
  - id: fedex
    name: FedEx
    aliases: [FedEx]
    official_domains: [fedex.com]
  - id: dtdc
