# Gatehouse country pack: India v0.2.0
# Seed data from public advisories (RBI, I4C, bank official domains).
# Community-extensible; schema-validated in CI; pinned per case in bundles.
#
# v0.2.0 (P6 calibration set): trusted_domains tier added for legitimate
# non-bank link surfaces; lexicon gaps closed for relative-impersonation,
# UPI collect fraud, courier intimidation, and job/task scams found while
# designing the 600-case evaluation set (doc 07).
region: in
version: 0.2.0
languages: [en, hi]

scoring:
  strong_phrase: 0.45
  moderate_phrase: 0.30
  weak_phrase: 0.15
  payment_intent_bonus: 0.20
  url_present_bonus: 0.15

issuers:
  - id: sbi
    name: State Bank of India
    aliases: [SBI, StateBank]
    official_domains: [sbi.co.in, onlinesbi.sbi, bank.sbi, sbi.co.in.in, sbiquest.in]
    sms_sender_ids: [SBIBNK, SBIINB, SBICRD]
  - id: hdfc
    name: HDFC Bank
    aliases: [HDFC]
    official_domains: [hdfcbank.com, hdfc.com, hdfcbank.net]
    sms_sender_ids: [HDFCBK, HDFCBK]
  - id: icici
    name: ICICI Bank
    aliases: [ICICI]
    official_domains: [icicibank.com, icicibank.co.in, iciciprulife.com]
    sms_sender_ids: [ICICIB, ICICIBANK]
  - id: axis
    name: Axis Bank
    aliases: [Axis]
    official_domains: [axisbank.com, axisbank.co.in]
    sms_sender_ids: [AXISBK, AXISCBL]
  - id: pnb
    name: Punjab National Bank
    aliases: [PNB]
    official_domains: [pnbindia.in, pnbindia.com]
    sms_sender_ids: [PNBNK]
  - id: uco
    name: UCO Bank
    aliases: [UCO, UCOBank, UCOBANK]
    official_domains: [ucoonline.bank.in, ucobank.com, ucoebank.in]
    sms_sender_ids: [UCOBNK, UCOIN]
  - id: baroda
    name: Bank of Baroda
    aliases: [BoB, BankofBaroda]
    official_domains: [bankofbaroda.in, bobfinancial.com]
    sms_sender_ids: [BOBNK]
  - id: kotak
    name: Kotak Mahindra Bank
    aliases: [Kotak, Kotak811]
    official_domains: [kotak.com, kotak811.com]
    sms_sender_ids: [KOTAKB, KTBNK]
  - id: union
    name: Union Bank of India
    aliases: [UnionBank, UBI]
    official_domains: [unionbankofindia.co.in, unionbankonline.co.in]
    sms_sender_ids: [UBNBK]
  - id: boi
    name: Bank of India
    aliases: [BOI]
    official_domains: [bankofindia.co.in]
    sms_sender_ids: [BOIBNK]
  - id: canara
    name: Canara Bank
    aliases: [Canara]
    official_domains: [canarabank.com, canarabank.in]
    sms_sender_ids: [CANBNK]
  - id: indusind
    name: IndusInd Bank
    aliases: [IndusInd]
    official_domains: [indusind.com]
    sms_sender_ids: [INDBNK]
  - id: yesbank
    name: Yes Bank
    aliases: [YesBank]
    official_domains: [yesbank.in]
    sms_sender_ids: [YBLNK]
  - id: idfc
    name: IDFC First Bank
    aliases: [IDFC, IDFCFirst]
    official_domains: [idfcfirstbank.com, idfcbank.com]
    sms_sender_ids: [IDFCBK]
  - id: airtel
    name: Airtel Payments Bank
    aliases: [AirtelBank]
    official_domains: [airtel.in, airtelpaymentsbank.com]
    sms_sender_ids: [AIRTEL]
  - id: paytm
    name: Paytm Payments Bank
    aliases: [PaytmBank]
    official_domains: [paytmbank.com, paytm.com]
    sms_sender_ids: [PAYTM]
  - id: rbi
    name: Reserve Bank of India
    aliases: [RBI]
    official_domains: [rbi.org.in, rbi.net.in]
    sms_sender_ids: [RBISAY]
  - id: npci
    name: National Payments Corporation of India
    aliases: [NPCI]
    official_domains: [npci.org.in, upi.org.in, bhimupi.org.in]
    sms_sender_ids: []

rails:
  - id: upi
    display_name: UPI
    vpa_pattern: '^[a-zA-Z0-9._-]{2,256}@[a-zA-Z]{2,64}$'
    collect_request_fields: [payee_vpa, payee_name, amount, note]

lexicons:
  - lang: en
    strong:
      - "kyc expired"
      - "kyc has expired"
      - "kyc expires"
      - "kyc will expire"
      - "account will be blocked"
      - "account has been blocked"
      - "digital arrest"
      - "verify your account immediately"
      - "re-kyc required today"
      - "click to avoid suspension"
      - "your sim will be deactivated"
      - "parcel held at customs"
      - "lottery winner"
      - "you have won"
      - "claim your prize"
      # relative-impersonation signatures: relationship claim fused with the
      # money ask, so ordinary family news about lost phones never matches
      - "papa need money"
      - "mummy need money"
      - "son send money"
      - "daughter send money"
      # wrong-person payment reversal (UPI collect abuse)
      - "accidentally transferred"
      - "sent money by mistake"
      # collect-request coercion shapes
      - "your account is on hold"
      - "scan to receive"
      # task/job scam cores
      - "prepaid task"
      - "part time job guaranteed"
      # UPI collect abuse: the PIN-to-receive confusion attack
      - "enter your upi pin"
      # digital-arrest parcel variant: contraband-parcel claim
      - "passports seized"
    moderate:
      - "update your kyc"
      - "complete your kyc"
      - "urgent action required"
      - "suspicious activity detected"
      - "unusual login attempt"
      - "investment opportunity"
      - "guaranteed returns"
      - "guaranteed profit"
      - "limited slots"
      - "slots left"
      - "processing fee"
      - "send money to receive"
      - "pay joining fee"
      - "stay on video call"
      - "avoid arrest"
      - "money laundering"
      - "involved in"
      - "deposit immediately"
      - "won the"
      - "lucky draw winner"
      - "customs clearance"
      - "commission for completing"
      - "release your parcel"
    weak:
      - "offer expires soon"
      - "act now"
      - "exclusive deal"
      - "reward points expiring"
  - lang: hi
    strong:
      - "केवाईसी समाप्त"
      - "खाता बंद हो जाएगा"
      - "डिजिटल अरेस्ट"
      - "तुरंत सत्यापित करें"
      - "आपने लॉटरी जीती है"
      - "इनाम का दावा करें"
      - "गिरफ्तारी से बचने"
      - "मनी लॉन्ड्रिंग"
      # relative-impersonation: relationship fused with the money ask
      - "पापा को पैसे भेजो"
      - "मम्मी को पैसे भेजो"
      - "बेटा पैसे भेजो"
      # wrong-person payment reversal (UPI collect abuse)
      - "पैसे वापस"
      # lottery phrasing variant: number-won form
      - "आपका नंबर जीता"
    moderate:
      - "केवाईसी अपडेट करें"
      - "आवश्यक कार्रवाई"
      - "गारंटीड रिटर्न"
      - "प्रोसेसिंग फीस"
      - "पैसे भेजें"
      - "जुर्माना भरें"
      - "सीमित स्लॉट"
      - "ज्वाइनिंग फीस"
      - "कर जमा"
      - "दावा करें"
      - "पार्सल जब्त"
      - "कस्टम शुल्क"
      # job/task scam Hindi forms
      - "घर बैठे काम"
      - "कमीशन तुरंत"
      - "रिफंड रोक दिया"
      # order-independent refund-coercion tail (amounts split other forms)
      - "तभी रिफंड मिलेगा"
    weak:
      - "ऑफर जल्द समाप्त"
      - "अभी करें"

# Curated NON-issuer brands whose official link surfaces are safe to trust
# for legitimate traffic. Kept separate from issuers on purpose: trusting a
# retailer says nothing about a bank's link surface. Domains are the official
# registrable domains of each service; suffix matching covers subdomains.
trusted_services:
  - id: amazon
    name: Amazon
    aliases: [Amazon]
    official_domains: [amazon.in, amazonpay.in]
  - id: flipkart
    name: Flipkart
    aliases: [Flipkart]
    official_domains: [flipkart.com]
  - id: swiggy
