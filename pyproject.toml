[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatehouse"
version = "0.1.0"
description = "Autonomous fraud-defense agent for households. Nothing harmful gets past the gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Prakhar Shukla" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
agents = ["strands-agents>=0.2", "strands-agents-tools>=0.2", "boto3>=1.34"]
gateway = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/gatehouse"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "S",      # bandit (security)
    "C4",     # comprehensions
    "SIM",    # simplify
    "PTH",    # use pathlib
    "RUF",    # ruff-specific
    "TRY",    # exception handling discipline
    "ASYNC",  # async correctness
]
ignore = [
    "TRY003", # long messages in raise are fine; we use typed codes
    "S101",   # assert usage allowed in tests dir only (overridden below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/gatehouse/evaluation/generator.py" = [
    "S311",  # random ok: seeded, non-crypto use
    "E501",  # fixture scam templates are verbatim-length by design
]
"src/gatehouse/evaluation/full_set.py" = [
    "S311",  # random ok: seeded, non-crypto use
    "E501",  # fixture scam templates are verbatim-length by design
]

[tool.ruff.format]
quote-style = "double"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["strands.*", "boto3.*", "botocore.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gatehouse.agents.mock_model"
# Strands' shipped stubs type stream()/structured_output() more loosely than the
# runtime contract this adapter implements and tests verify; intentional.
disable_error_code = ["override", "unused-ignore"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests excluded from fast suite",
]

[tool.coverage.run]
source = ["src/gatehouse"]
omit = ["src/gatehouse/evaluation/generator.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
