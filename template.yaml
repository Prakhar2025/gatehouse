AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Gatehouse intake API, investigation handler, and persistence tables

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, prod]
  TelegramWebhookSecret:
    Type: String
    Description: Secret path/header token for Telegram webhook verification
    NoEcho: true
  TelegramBotToken:
    Type: String
    Description: Bot token for outbound replies and guardian cards
    NoEcho: true
  GuardianChatId:
    Type: String
    Description: Guardian-facing Telegram chat id for escalation cards
  ConsolePassword:
    Type: String
    Description: Guardian console password (HMAC session cookie)
    NoEcho: true
  GraphSalt:
    Type: String
    Description: HMAC salt for identifier hashing (rotate per environment)
    NoEcho: true
  WhatsAppAppSecret:
    Type: String
    Description: Meta app secret for x-hub-signature-256 verification
    NoEcho: true
  WhatsAppVerifyToken:
    Type: String
    Description: Token Meta echoes during subscription handshake
    NoEcho: true

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 60
    Environment:
      Variables:
        GATEHOUSE_ENVIRONMENT: !Ref Environment
        GATEHOUSE_REGION: !Ref AWS::Region
        GATEHOUSE_TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret
        GATEHOUSE_TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        GATEHOUSE_GUARDIAN_TELEGRAM_CHAT_ID: !Ref GuardianChatId
        GATEHOUSE_GRAPH_SALT: !Ref GraphSalt
        GATEHOUSE_WHATSAPP_APP_SECRET: !Ref WhatsAppAppSecret
        GATEHOUSE_WHATSAPP_VERIFY_TOKEN: !Ref WhatsAppVerifyToken
        GATEHOUSE_CASES_TABLE: !Ref CasesTable
        GATEHOUSE_GRAPH_TABLE: !Ref GraphTable
        GATEHOUSE_CASES_TABLE_NAME: !Sub gatehouse-cases-${Environment}
        GATEHOUSE_GRAPH_TABLE_NAME: !Sub gatehouse-graph-${Environment}
        GATEHOUSE_EVENT_BUS_NAME: !Sub gatehouse-events-${Environment}
        GATEHOUSE_BEDROCK_MODEL_ID: apac.amazon.nova-micro-v1:0
        POWERTOOLS_METRICS_NAMESPACE: Gatehouse

Resources:
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub gatehouse-deps-${Environment}
      ContentUri: build/lambda-layer.zip
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
    Metadata:
      BuildMethod: python3.12

  IntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub gatehouse-intake-${Environment}
      Handler: gatehouse.handler.handler
      CodeUri: build/lambda-src.zip
      Layers:
        - !Ref DepsLayer
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            Path: /telegram
            Method: POST
            ApiId: !Ref HttpApi
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
            ApiId: !Ref HttpApi
        WhatsappWebhook:
          Type: HttpApi
          Properties:
            Path: /whatsapp
            Method: ANY
            ApiId: !Ref HttpApi
        # SES inbound: the receipt rule that targets this function is created at
        # deploy time against the verified domain (doc 09 section 4); it cannot
        # be expressed here without account-specific identity state.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GraphTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref IntakeEventBus
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              # The apac system-defined profile routes to any APAC region,
              # and IAM evaluates the foundation-model ARN of whichever
              # region served the call, so the model ARN is region-wildcarded
              # while the profile ARN stays account- and region-scoped.
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0

  ConsoleApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub gatehouse-console-api-${Environment}
      Handler: console-api.handler
      CodeUri: lambda/
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          GATEHOUSE_REGION: !Ref AWS::Region
          GATEHOUSE_CASES_TABLE_NAME: !Ref CasesTable
          GATEHOUSE_HOUSEHOLD_ID: shukla-home
          CONSOLE_PASSWORD: !Ref ConsolePassword
      Events:
        ConsoleAuth:
          Type: HttpApi
          Properties:
            Path: /console-api/auth
            Method: POST
            ApiId: !Ref HttpApi
        ConsoleApiProxy:
          Type: HttpApi
          Properties:
            Path: /console-api/{proxy+}
            Method: ANY
            ApiId: !Ref HttpApi
        ConsoleApiRoot:
          Type: HttpApi
          Properties:
            Path: /console-api
            Method: ANY
            ApiId: !Ref HttpApi
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable

  DigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub gatehouse-digest-${Environment}
      Handler: gatehouse.digest.handler
      CodeUri: build/lambda-src.zip
      Layers:
        - !Ref DepsLayer
      Events:
        MorningTick:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CasesTable

  IntakeEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub gatehouse-events-${Environment}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type, x-telegram-bot-api-secret-token, x-hub-signature-256]

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub gatehouse-cases-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  GraphTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub gatehouse-graph-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  ApiBase:
    Description: Webhook base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  EventBusArn:
    Description: Intake event bus for investigation consumers
    Value: !GetAtt IntakeEventBus.Arn
